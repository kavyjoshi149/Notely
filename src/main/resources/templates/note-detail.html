<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Note | Notely</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="note-detail">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container nav">
    <a href="/" class="logo">
      <svg class="logo-mark" viewBox="0 0 26 26" fill="none"><path d="M4 2h14l4 4v18H4V2z" stroke="#1B2A4A" stroke-width="1.6" fill="#F7F6F1"/><path d="M18 2v4h4" stroke="#1B2A4A" stroke-width="1.6" fill="none"/><path d="M8 12h10M8 16h7" stroke="#1B2A4A" stroke-width="1.4"/></svg>
      Notely
    </a>
    <nav class="nav-links">
      <a href="/explore" data-nav="explore">Explore</a>
      <a href="/upload" data-nav="upload">Upload</a>
      <a href="/library" data-nav="library">My Library</a>
    </nav>
    <div class="nav-actions">
      <a href="/login" class="btn btn-outline btn-sm">Sign in</a>
      <a href="/register" class="btn btn-primary btn-sm">Join free</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="nav-drawer">
    <a href="/explore">Explore</a>
    <a href="/upload">Upload</a>
    <a href="/library">My Library</a>
    <a href="/login">Sign in</a>
    <a href="/register">Join free</a>
  </div>
</header>

<main id="main">
  <div class="container" style="padding:44px 24px 80px;">
    <div class="detail-grid">
      <div>
        <span class="note-tag tag-navy" id="noteTag">CSE</span>
        <h1 id="noteTitle" style="margin-top:12px;">Note title</h1>
        <p class="note-code" id="noteCode" style="font-size:.95rem;"></p>

        <div style="display:flex; gap:22px; align-items:center; margin:18px 0 26px; padding:14px 0; border-top:1px dashed var(--paper-line); border-bottom:1px dashed var(--paper-line); font-size:.9rem; color:var(--text-muted);">
          <span><strong id="noteDownloads" style="color:var(--ink);"></strong> downloads</span>
          <span><strong id="noteLikes" style="color:var(--ink);"></strong> likes</span>
        </div>

        <p id="noteDesc" style="font-size:1rem; color:var(--text); max-width:64ch;"></p>

        <div style="display:flex; gap:12px; margin:20px 0 46px;">
          <a href="/login" class="btn btn-primary" id="downloadBtn">Download PDF</a>
          <button class="btn btn-outline" type="button" disabled title="Coming soon">Like</button>
          <button class="btn btn-outline" type="button" disabled title="Coming soon">Bookmark</button>
        </div>

        <h3>Comments <span style="font-weight:400;font-size:.85rem;color:var(--text-muted);">(coming soon)</span></h3>
        <form id="commentForm" style="display:flex; gap:10px; margin:14px 0 8px;">
          <input type="text" id="commentInput" placeholder="Comments are not available yet" disabled>
          <button type="submit" class="btn btn-primary btn-sm" disabled>Post</button>
        </form>
        <div id="commentList"></div>
      </div>

      <aside>
        <div class="pdf-preview" style="margin-bottom:18px;">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>
          <span style="font-size:.82rem;">Preview available after login</span>
        </div>
        <div class="uploader-card">
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
            <span class="avatar" id="uploaderInitials" style="width:38px;height:38px;font-size:.9rem;"></span>
            <div>
              <div style="font-weight:700;" id="uploaderName"></div>
              <div style="font-size:.8rem; color:var(--text-muted);">Uploaded <span id="noteWhen"></span></div>
            </div>
          </div>
          <button type="button" class="btn btn-outline btn-block btn-sm" disabled title="Coming soon">Message uploader</button>
        </div>
      </aside>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-row">
    <div class="logo" style="font-size:1.05rem;">
      <svg class="logo-mark" width="20" height="20" viewBox="0 0 26 26" fill="none"><path d="M4 2h14l4 4v18H4V2z" stroke="#1B2A4A" stroke-width="1.6" fill="#F7F6F1"/><path d="M8 12h10M8 16h7" stroke="#1B2A4A" stroke-width="1.4"/></svg>
      Notely
    </div>
    <nav class="footer-links">
      <a href="/explore">Explore</a>
      <a href="/upload">Upload</a>
      <a href="/library">My Library</a>
    </nav>
    <span class="footer-note">&copy; <span class="js-year"></span> Notely. Built by students, for students.</span>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script src="/js/note-detail.js"></script>
</body>
</html>
